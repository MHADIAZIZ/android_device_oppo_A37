name: Build LineageOS 14.1 for A37

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04
    timeout-minutes: 360
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Setup build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y git-core gnupg flex bison gperf build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z-dev ccache libgl1-mesa-dev libxml2-utils xsltproc unzip python
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH
        
    - name: Initialize LineageOS source
      run: |
        mkdir -p ~/android/lineage
        cd ~/android/lineage
        repo init -u https://github.com/LineageOS/android.git -b cm-14.1 --depth=1
        
    - name: Sync source code
      run: |
        cd ~/android/lineage
        repo sync -c -j4 --force-sync --no-clone-bundle
        
    - name: Clone device tree
      run: |
        cd ~/android/lineage
        mkdir -p device/oppo
        git clone https://github.com/MHADIAZIZ/android_device_oppo_A37.git device/oppo/A37
        
    - name: Build ROM
      run: |
        cd ~/android/lineage
        source build/envsetup.sh
        breakfast A37
        mka bacon -j4
        
    - name: Upload ROM
      uses: actions/upload-artifact@v3
      with:
        name: lineage-14.1-UNOFFICIAL-A37
        path: ~/android/lineage/out/target/product/A37/lineage-14.1-*.zip
